name: Release macOS app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_NAME: Kakitangan Leave Notifier
  PROJECT: KakitanganLeaveNotifier.xcodeproj
  SCHEME: KakitanganLeaveNotifier
  APPCAST_URL: https://github.com/anderscheow/kakitangan-leave-notifier/releases/latest/download/appcast.xml
  SPARKLE_ACCOUNT: com.kakitangan.leave-notifier

jobs:
  release:
    name: Sign, notarize, and publish
    runs-on: macos-26

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive release metadata
        id: release
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == "$GITHUB_REF_NAME" || ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use vMAJOR.MINOR.PATCH, for example v1.0.1." >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Resolve packages
        run: >-
          xcodebuild
          -project "$PROJECT"
          -scheme "$SCHEME"
          -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"
          -resolvePackageDependencies

      - name: Import Developer ID certificates
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_INSTALLER_P12_BASE64: ${{ secrets.DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          APPLICATION_P12="$RUNNER_TEMP/developer-id-application.p12"
          INSTALLER_P12="$RUNNER_TEMP/developer-id-installer.p12"

          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 -D > "$APPLICATION_P12"
          printf '%s' "$DEVELOPER_ID_INSTALLER_P12_BASE64" | base64 -D > "$INSTALLER_P12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$APPLICATION_P12" -k "$KEYCHAIN_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security import "$INSTALLER_P12" -k "$KEYCHAIN_PATH" -P "$SIGNING_CERTIFICATE_PASSWORD" -A -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install an optional Developer ID provisioning profile
        env:
          DEVELOPER_ID_PROVISIONING_PROFILE_BASE64: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${DEVELOPER_ID_PROVISIONING_PROFILE_BASE64:-}" ]]; then
            exit 0
          fi
          PROFILE_DIRECTORY="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIRECTORY"
          printf '%s' "$DEVELOPER_ID_PROVISIONING_PROFILE_BASE64" | base64 -D > "$PROFILE_DIRECTORY/developer-id.provisionprofile"

      - name: Archive the Developer ID app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
          DEVELOPER_ID_PROVISIONING_PROFILE_NAME: ${{ secrets.DEVELOPER_ID_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/KakitanganLeaveNotifier.xcarchive"
          SIGNING_ARGUMENTS=()
          if [[ -n "${DEVELOPER_ID_PROVISIONING_PROFILE_NAME:-}" ]]; then
            SIGNING_ARGUMENTS+=("PROVISIONING_PROFILE_SPECIFIER=$DEVELOPER_ID_PROVISIONING_PROFILE_NAME")
          fi

          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$DEVELOPER_ID_APPLICATION_IDENTITY" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            MARKETING_VERSION="${{ steps.release.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.release.outputs.build_number }}" \
            ${SIGNING_ARGUMENTS[@]+"${SIGNING_ARGUMENTS[@]}"}

      - name: Re-sign embedded Sparkle code
        env:
          DEVELOPER_ID_APPLICATION_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION_IDENTITY }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/KakitanganLeaveNotifier.xcarchive/Products/Applications/$APP_NAME.app"
          SPARKLE_FRAMEWORK="$APP_PATH/Contents/Frameworks/Sparkle.framework"
          SPARKLE_CONTENTS="$SPARKLE_FRAMEWORK/Versions/Current"
          SIGNING_TARGETS=(
            "$SPARKLE_CONTENTS/Autoupdate"
            "$SPARKLE_CONTENTS/XPCServices/Downloader.xpc"
            "$SPARKLE_CONTENTS/XPCServices/Installer.xpc"
            "$SPARKLE_CONTENTS/Updater.app"
            "$SPARKLE_FRAMEWORK"
            "$APP_PATH"
          )

          sign() {
            codesign --force \
              --sign "$DEVELOPER_ID_APPLICATION_IDENTITY" \
              --timestamp \
              --options runtime \
              --preserve-metadata=identifier,entitlements \
              "$1"
          }

          verify() {
            local target="$1" signature
            codesign --verify --strict --verbose=2 "$target"
            signature="$(codesign -dvv "$target" 2>&1)"
            grep -q 'Authority=Developer ID Application' <<<"$signature"
            grep -q '^Timestamp=' <<<"$signature"
          }

          for target in "${SIGNING_TARGETS[@]}"; do
            [[ -e "$target" ]] || { echo "::error::Missing signing target: $target"; exit 1; }
            sign "$target"
          done

          for target in "${SIGNING_TARGETS[@]}"; do
            verify "$target"
          done

      - name: Notarize app and create release artifacts
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          DEVELOPER_ID_INSTALLER_IDENTITY: ${{ secrets.DEVELOPER_ID_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          APP_PATH="$RUNNER_TEMP/KakitanganLeaveNotifier.xcarchive/Products/Applications/$APP_NAME.app"
          RELEASE_DIRECTORY="$RUNNER_TEMP/release"
          UPDATE_ARCHIVE="$RELEASE_DIRECTORY/KakitanganLeaveNotifier-$VERSION.zip"
          INSTALLER_PACKAGE="$RELEASE_DIRECTORY/KakitanganLeaveNotifier-$VERSION.pkg"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          NOTARY_ARGUMENTS=(
            --key "$API_KEY_PATH"
            --key-id "$APP_STORE_CONNECT_API_KEY_ID"
            --issuer "$APP_STORE_CONNECT_ISSUER_ID"
          )

          # notarytool `submit --wait` exits 0 even when the result is Invalid,
          # so check the status explicitly and dump Apple's per-file reasons
          # before failing. Without this the run only fails later at `stapler
          # staple` with an opaque "Error 65".
          notarize() {
            local artifact="$1" response submission_id status
            response="$(xcrun notarytool submit "$artifact" "${NOTARY_ARGUMENTS[@]}" --wait --output-format json)"
            submission_id="$(plutil -extract id raw -o - - <<<"$response")"
            status="$(plutil -extract status raw -o - - <<<"$response")"
            echo "Notarization for $(basename "$artifact"): submission $submission_id -> $status"
            if [[ "$status" != "Accepted" ]]; then
              echo "::group::notarytool log for $submission_id"
              xcrun notarytool log "$submission_id" "${NOTARY_ARGUMENTS[@]}" || true
              echo "::endgroup::"
              echo "::error::Notarization failed for $(basename "$artifact") (status: $status)"
              exit 1
            fi
          }

          mkdir -p "$RELEASE_DIRECTORY"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_P8" > "$API_KEY_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$UPDATE_ARCHIVE"
          notarize "$UPDATE_ARCHIVE"
          xcrun stapler staple "$APP_PATH"
          spctl -a -vv -t exec "$APP_PATH"

          rm "$UPDATE_ARCHIVE"
          ditto -c -k --keepParent "$APP_PATH" "$UPDATE_ARCHIVE"
          productbuild \
            --sign "$DEVELOPER_ID_INSTALLER_IDENTITY" \
            --component "$APP_PATH" /Applications \
            "$INSTALLER_PACKAGE"
          notarize "$INSTALLER_PACKAGE"
          xcrun stapler staple "$INSTALLER_PACKAGE"
          spctl -a -vv -t install "$INSTALLER_PACKAGE"

      - name: Generate Sparkle appcast
        env:
          SPARKLE_EDDSA_PRIVATE_KEY: ${{ secrets.SPARKLE_EDDSA_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          UPDATE_DIRECTORY="$RUNNER_TEMP/updates"
          UPDATE_ARCHIVE="$RUNNER_TEMP/release/KakitanganLeaveNotifier-$VERSION.zip"
          RELEASE_NOTES="$UPDATE_DIRECTORY/KakitanganLeaveNotifier-$VERSION.html"
          SPARKLE_GENERATE_APPC="$RUNNER_TEMP/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          DOWNLOAD_URL_PREFIX="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/"

          mkdir -p "$UPDATE_DIRECTORY"
          curl --fail --location "$APPCAST_URL" --output "$UPDATE_DIRECTORY/appcast.xml" || rm -f "$UPDATE_DIRECTORY/appcast.xml"
          cp "$UPDATE_ARCHIVE" "$UPDATE_DIRECTORY/"
          RELEASE_NOTES_BODY="$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            --method POST \
            -f tag_name="$GITHUB_REF_NAME" \
            --jq .body)"
          RELEASE_NOTES_BODY="$RELEASE_NOTES_BODY" python3 - <<'PY' > "$RELEASE_NOTES"
          import html
          import os

          body = os.environ.get("RELEASE_NOTES_BODY", "").strip()
          if not body:
              body = "See the GitHub release page for details."

          print("<!doctype html>")
          print("<html><head><meta charset=\"utf-8\"><title>Release Notes</title></head>")
          print("<body>")
          print("<h1>Kakitangan Leave Notifier Release Notes</h1>")
          print("<pre style=\"white-space: pre-wrap; font: 13px -apple-system, BlinkMacSystemFont, sans-serif;\">")
          print(html.escape(body))
          print("</pre>")
          print("</body></html>")
          PY
          printf '%s' "$SPARKLE_EDDSA_PRIVATE_KEY" | "$SPARKLE_GENERATE_APPC" \
            --account "$SPARKLE_ACCOUNT" \
            --ed-key-file - \
            --download-url-prefix "$DOWNLOAD_URL_PREFIX" \
            --maximum-versions 3 \
            --maximum-deltas 0 \
            --versions "${{ steps.release.outputs.build_number }}" \
            -o "$UPDATE_DIRECTORY/appcast.xml" \
            "$UPDATE_DIRECTORY"

      - name: Publish GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            "$RUNNER_TEMP/release/KakitanganLeaveNotifier-$VERSION.zip" \
            "$RUNNER_TEMP/release/KakitanganLeaveNotifier-$VERSION.pkg" \
            "$RUNNER_TEMP/updates/KakitanganLeaveNotifier-$VERSION.html" \
            "$RUNNER_TEMP/updates/appcast.xml#appcast.xml" \
            --title "Kakitangan Leave Notifier $VERSION" \
            --generate-notes
